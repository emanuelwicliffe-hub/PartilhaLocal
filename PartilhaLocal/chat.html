<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversa | PartilhaLocal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <h1>Partilha<span>Local</span></h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="explorar.html">Explorar</a></li>
                <li><a href="/minha-conta">Minha Conta</a></li>
                <li><a href="login.html">Entrar</a></li>
                <li><a href="registo.html">Registar</a></li>
            </ul>
        </nav>
    </header>

    <main class="pagina-chat">
        <section class="painel-chat">
            <h2>Conversa sobre o empréstimo</h2>

            <div class="info-chat">
                <p id="material-chat">A carregar material...</p>
                <p id="proprietario-chat"></p>
            </div>

            <div id="mensagens-chat" class="mensagens-chat" aria-live="polite"></div>

            <form id="form-chat" class="form-chat">
                <label for="mensagem-chat" class="sr-only">Mensagem</label>
                <input type="text" id="mensagem-chat" name="mensagem-chat" placeholder="Escreva uma mensagem..."
                    maxlength="300" required>
                <button type="submit">Enviar</button>
            </form>
        </section>
    </main>

    <script src="js/chat.js"></script>
</body>

</html>
